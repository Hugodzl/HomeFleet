name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read-only by default; no job here writes (docs/reference/releasing.md).
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Static analysis of the workflows themselves (unpinned actions, excess
  # permissions, template injection, cache poisoning…). Findings fail the
  # job: advanced-security off = plain output with a real exit code. The
  # zizmor version is pinned because this workflow is also the release gate:
  # a new upstream audit must not fail an already-pushed tag. Bump it
  # deliberately, in a PR.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: 1.32.0
