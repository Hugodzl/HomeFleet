name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read-only by default; no job here writes (docs/reference/releasing.md).
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:docs
      - run: pnpm typecheck
      - run: pnpm test

  # Static analysis of the workflows themselves (unpinned actions, excess
  # permissions, template injection, cache poisoning…). Findings fail the
  # job: advanced-security off = plain output with a real exit code. This
  # workflow is also the release gate, so the gate is deterministic: a
  # pinned zizmor version (bump it deliberately, in a PR) and no online
  # audits, so neither a new upstream audit nor a newly published advisory
  # can fail an already-pushed tag.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: 1.32.0
          online-audits: false

  # The online audits (known-vulnerable actions, impostor commits, stale
  # refs…) on pull requests only. Not part of the release gate: inside the
  # gate, github.event_name is the release run's `push`, so this is skipped.
  zizmor-online:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: 1.32.0
