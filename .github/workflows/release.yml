name: Release

# A v* tag push packs, signs, verifies, smokes and publishes a GitHub Release.
# Run it by hand (workflow_dispatch) on main to exercise everything except the
# Release itself: a manual run never publishes, on any ref. Job chain:
# gate → pack → sign → verify + smoke → release (docs/reference/releasing.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, queued, never cancelled: two runs for the same
# tag must not race the draft delete/create in `release`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: $/.github/workflows/ci.yml

  # Builds the tarball. Holds NO secret: everything with installed
  # dependencies runs here or in `verify`, never next to the signing key.
  pack:
    needs: gate
    runs-on: ubuntu-latest
    # The tarball's digest, for `sign`, which never receives the file itself.
    outputs:
      version: ${{ steps.digest.outputs.version }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      size: ${{ steps.digest.outputs.size }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Catches a tag pushed on a branch commit by mistake. Not a defense
      # against an edited workflow (it could drop this step): Hugo's approval
      # of the `release` environment is that gate.
      - name: The tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      # Fail before packing, not after the smoke: a Release must never go out
      # with a missing or mis-titled notes file (see docs/reference/releasing.md).
      - name: Release notes exist and are titled "# HomeFleet <tag> — …"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "::error::missing $notes"; exit 1; }
          head -n 1 "$notes" | grep -q "^# HomeFleet $GITHUB_REF_NAME — ." \
            || { echo "::error::$notes must start with '# HomeFleet $GITHUB_REF_NAME — <theme>'"; exit 1; }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      # No dependency cache in any release job (package-manager-cache: false):
      # a cache written by an untrusted run must never feed the build that ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Pack (tag must match the daemon version)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            pnpm pack:release --tag "$GITHUB_REF_NAME"
          else
            pnpm pack:release
          fi
      - name: Digest for the sign job
        id: digest
        run: |
          set -euo pipefail
          files=(release/homefleet-*.tgz)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected exactly one tarball"; exit 1; }
          f="${files[0]}"
          v="${f#release/homefleet-}"
          {
            echo "version=${v%.tgz}"
            echo "sha256=$(sha256sum "$f" | cut -d' ' -f1)"
            echo "size=$(stat -c %s "$f")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homefleet-tarball
          path: release/homefleet-*.tgz
          if-no-files-found: error

  # The ONLY job that can read the signing key. The key is an ENVIRONMENT
  # secret: the environment admits only main and v* tags and waits for
  # Hugo's approval. This job installs nothing — no pnpm, no node_modules, no
  # cache — checks out just the dependency-free signer and the file it reads
  # the HFP version from, and downloads NO artifact: it signs the digest pack
  # computed (version, sha256, size), so nothing pack produced can overwrite
  # the signer or the Node it runs on. A lying digest fails `verify`, which
  # checks the real tarball. scripts/lib/workflows.test.ts pins all of this.
  sign:
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/sign-release.mjs
            packages/protocol/src/version.ts
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # Signed manifest + detached Ed25519 signature (fleet-upgrade spec,
      # Phase 1), over the digest; the signer validates each value.
      - name: Sign the tarball
        env:
          HOMEFLEET_RELEASE_KEY: ${{ secrets.HOMEFLEET_RELEASE_KEY }}
          HOMEFLEET_RELEASE_VERSION: ${{ needs.pack.outputs.version }}
          HOMEFLEET_RELEASE_SHA256: ${{ needs.pack.outputs.sha256 }}
          HOMEFLEET_RELEASE_SIZE: ${{ needs.pack.outputs.size }}
        run: node src/scripts/sign-release.mjs --digest release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homefleet-signature
          path: |
            release/homefleet-*.manifest.json
            release/homefleet-*.manifest.sig
          if-no-files-found: error

  # Verified against the key PINNED in the daemon source, so a secret/key
  # mismatch fails here, before publish. Has dependencies, no secret.
  verify:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homefleet-tarball
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homefleet-signature
          path: release
      - name: Verify the signature against the pinned public key
        run: pnpm verify:release release/homefleet-*.tgz

  # Install the REAL artifact the way a user does: no checkout, no pnpm,
  # deps from the registry, npm-generated shims. Node 20 = the documented floor.
  smoke:
    needs: sign
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homefleet-tarball
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homefleet-signature
          path: release
      - name: Global install
        # Deliberately ad hoc: install the artifact exactly as a user does,
        # deps resolved from the registry.
        run: npm i -g ./release/homefleet-*.tgz # zizmor: ignore[adhoc-packages]
      - name: Bins print their exact version (exit 0 alone is not enough)
        run: |
          version="$(basename release/homefleet-*.tgz .tgz)"
          version="${version#homefleet-}"
          test "$(homefleet --version)" = "homefleet $version"
          test "$(homefleetd --version)" = "homefleetd $version"
          command -v homefleet-mcp-stdio
      # Only the smoke script — still no pnpm install on this runner.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/smoke-installed.mjs
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false
      - name: Run the installed product (daemon, CLI, stdio MCP shim)
        run: |
          version="$(basename release/homefleet-*.tgz .tgz)"
          node src/scripts/smoke-installed.mjs "${version#homefleet-}"
      - name: Bins via the PowerShell shims
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = (Get-Item release/homefleet-*.tgz).BaseName
          $version = $name.Substring("homefleet-".Length)
          if ((homefleet --version) -ne "homefleet $version") { exit 1 }
          if ((homefleetd --version) -ne "homefleetd $version") { exit 1 }

  release:
    needs: [verify, smoke]
    # A manual run never publishes, even when dispatched on a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: docs/releases
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homefleet-tarball
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homefleet-signature
          path: release
      # Build provenance (SLSA Build L2): which commit and workflow run built
      # these bytes. Check with `gh attestation verify <file> -R <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/homefleet-*.tgz
            release/homefleet-*.manifest.json
      # Draft first, assets attached, then publish: an immutable Release
      # can't gain assets once published. A re-run after a failed publish
      # replaces the leftover draft; a PUBLISHED Release is never touched.
      # Title = the notes file's first line without "# "; body = the rest.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Only gh's "release not found" means there is no Release yet; any
          # other failure (network, auth, rate limit) stops the run.
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/view.err")"; then
            if [ "$draft" != "true" ]; then
              echo "::error::release $tag is already published"; exit 1
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          elif ! grep -q "release not found" "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            echo "::error::could not check for an existing release $tag"; exit 1
          fi
          notes="docs/releases/$tag.md"
          tail -n +2 "$notes" | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          # The three signed-release files only, by name pattern: anything
          # else pack slipped into its artifact stays out of the Release.
          gh release create "$tag" release/homefleet-*.tgz \
            release/homefleet-*.manifest.json release/homefleet-*.manifest.sig \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$(head -n 1 "$notes" | sed 's/^# //')" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
