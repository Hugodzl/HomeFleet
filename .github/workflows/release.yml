name: Release

# A v* tag push packs, signs, verifies, smokes and publishes a GitHub Release.
# Run it by hand (workflow_dispatch) on main to exercise everything except the
# Release itself: a manual run never publishes, on any ref. Job chain:
# gate → pack → sign → verify + smoke → release (docs/reference/releasing.md).
#
# Three modes (scripts/lib/release-plan.ts): a vX.Y.Z-rc.N tag is a release
# CANDIDATE (the final X.Y.Z tarball, published as a prerelease); a final
# vX.Y.Z tag with published candidates PROMOTES the highest one (its exact
# tarball, re-signed - Ed25519 signing is deterministic, so the manifest and
# signature come out identical); any other final tag is a plain BUILD.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, queued, never cancelled: two runs for the same
# tag must not race the draft delete/create in `release`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: $/.github/workflows/ci.yml

  # Builds the tarball. Holds NO secret: everything with installed
  # dependencies runs here or in `verify`, never next to the signing key.
  pack:
    needs: gate
    runs-on: ubuntu-latest
    # The tarball's digest, for `sign`, which never receives the file itself.
    outputs:
      version: ${{ steps.digest.outputs.version }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      size: ${{ steps.digest.outputs.size }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Catches a tag pushed on a branch commit by mistake. Not a defense
      # against an edited workflow (it could drop this step): Hugo's approval
      # of the `release` environment is that gate.
      - name: The tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in any release job (package-manager-cache: false):
      # a cache written by an untrusted run must never feed the build that ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # build, candidate or promote. Pack's own view: the release job
      # derives it again rather than trust this job's outputs.
      - name: Plan this run (build, candidate or promote)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          else
            echo '[]' > "$RUNNER_TEMP/releases.json"
          fi
          pnpm release:plan "$RUNNER_TEMP/releases.json"
      # Fail before packing, not after the smoke: a Release must never go out
      # with a missing or mis-titled notes file (see docs/reference/releasing.md).
      # A candidate uses its final's notes.
      - name: Release notes exist and are titled "# HomeFleet <final> — …"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FINAL: ${{ steps.plan.outputs.final }}
        run: |
          notes="docs/releases/$FINAL.md"
          test -f "$notes" || { echo "::error::missing $notes"; exit 1; }
          head -n 1 "$notes" | grep -q "^# HomeFleet $FINAL — ." \
            || { echo "::error::$notes must start with '# HomeFleet $FINAL — <theme>'"; exit 1; }
      - name: Pack (tag must match the daemon version)
        if: steps.plan.outputs.mode != 'promote'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            pnpm pack:release --tag "$GITHUB_REF_NAME"
          else
            pnpm pack:release
          fi
      # A promote ships the candidate's tarball, not a rebuild: the bytes
      # tested on the rig are the bytes released. Only on the candidate's own
      # commit, and only once they verify against the pinned key.
      - name: "Promote: take the candidate's tarball"
        if: steps.plan.outputs.mode == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          [ "$(git rev-list -n 1 "$CANDIDATE")" = "$GITHUB_SHA" ] \
            || { echo "::error::$GITHUB_REF_NAME is not on the commit of $CANDIDATE"; exit 1; }
          gh release download "$CANDIDATE" --repo "$GITHUB_REPOSITORY" -p 'homefleet-*' -D candidate
          pnpm verify:release candidate/homefleet-*.tgz
          mkdir -p release
          cp candidate/homefleet-*.tgz release/
      - name: Digest for the sign job
        id: digest
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/homefleet-*.tgz)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected exactly one tarball"; exit 1; }
          f="${files[0]}"
          v="${f#release/homefleet-}"
          sha256="$(sha256sum "$f" | cut -d' ' -f1)"
          size="$(stat -c %s "$f")"
          {
            echo "version=${v%.tgz}"
            echo "sha256=$sha256"
            echo "size=$size"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homefleet-tarball
          path: release/homefleet-*.tgz
          if-no-files-found: error

  # The ONLY job that can read the signing key. The key is an ENVIRONMENT
  # secret: the environment admits only main and v* tags and waits for
  # Hugo's approval. This job installs nothing — no pnpm, no node_modules, no
  # cache — checks out just the dependency-free signer and the file it reads
  # the HFP version from, and downloads NO artifact: it signs the digest pack
  # computed (version, sha256, size), so nothing pack produced can overwrite
  # the signer or the Node it runs on. A lying digest fails `verify`, which
  # checks the real tarball. scripts/lib/workflows.test.ts pins all of this.
  sign:
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/sign-release.mjs
            packages/protocol/src/version.ts
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # Signed manifest + detached Ed25519 signature (fleet-upgrade spec,
      # Phase 1), over the digest; the signer validates each value.
      - name: Sign the tarball
        env:
          HOMEFLEET_RELEASE_KEY: ${{ secrets.HOMEFLEET_RELEASE_KEY }}
          HOMEFLEET_RELEASE_VERSION: ${{ needs.pack.outputs.version }}
          HOMEFLEET_RELEASE_SHA256: ${{ needs.pack.outputs.sha256 }}
          HOMEFLEET_RELEASE_SIZE: ${{ needs.pack.outputs.size }}
        run: node src/scripts/sign-release.mjs --digest release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homefleet-signature
          path: |
            release/homefleet-*.manifest.json
            release/homefleet-*.manifest.sig
          if-no-files-found: error
          # A signed manifest is a credential: keep it only as long as the
          # run needs it (a re-run after a day starts from the tag again).
          retention-days: 1

  # Verified against the key PINNED in the daemon source, so a secret/key
  # mismatch fails here, before publish. Has dependencies, no secret.
  verify:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homefleet-tarball
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homefleet-signature
          path: release
      - name: Verify the signature against the pinned public key
        run: pnpm verify:release release/homefleet-*.tgz

  # Install the REAL artifact the way a user does: no checkout, no pnpm,
  # deps from the registry, npm-generated shims. Node 20 = the documented floor.
  smoke:
    needs: sign
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homefleet-tarball
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homefleet-signature
          path: release
      - name: Global install
        # Deliberately ad hoc: install the artifact exactly as a user does,
        # deps resolved from the registry.
        run: npm i -g ./release/homefleet-*.tgz # zizmor: ignore[adhoc-packages]
      - name: Bins print their exact version (exit 0 alone is not enough)
        run: |
          version="$(basename release/homefleet-*.tgz .tgz)"
          version="${version#homefleet-}"
          test "$(homefleet --version)" = "homefleet $version"
          test "$(homefleetd --version)" = "homefleetd $version"
          command -v homefleet-mcp-stdio
      # Only the smoke script — still no pnpm install on this runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/smoke-installed.mjs
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false
      - name: Run the installed product (daemon, CLI, stdio MCP shim)
        run: |
          version="$(basename release/homefleet-*.tgz .tgz)"
          node src/scripts/smoke-installed.mjs "${version#homefleet-}"
      - name: Bins via the PowerShell shims
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = (Get-Item release/homefleet-*.tgz).BaseName
          $version = $name.Substring("homefleet-".Length)
          if ((homefleet --version) -ne "homefleet $version") { exit 1 }
          if ((homefleetd --version) -ne "homefleetd $version") { exit 1 }

  release:
    needs: [verify, smoke]
    # A manual run never publishes, even when dispatched on a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/releases
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homefleet-tarball
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homefleet-signature
          path: release
      # The plan again, from the tag and the published Releases alone: this
      # job holds write tokens, so nothing from pack's (dependency-running)
      # job decides what it publishes.
      - name: Plan (re-derived here; pack's plan is not trusted)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          candidate=""
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.[1-9][0-9]*$ ]]; then
            mode=candidate
            final="v${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            final="$tag"
            candidate="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
              | jq -r 'add | .[] | select(.prerelease and (.draft | not)) | .tag_name' \
              | { grep -E "^${final//./\\.}-rc\.[1-9][0-9]*$" || true; } \
              | sort -V | tail -n 1)"
            if [ -n "$candidate" ]; then
              mode=promote
              sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$candidate" --jq .sha)"
              [ "$sha" = "$GITHUB_SHA" ] \
                || { echo "::error::$tag is not on the commit of $candidate"; exit 1; }
            else
              mode=build
            fi
          else
            echo "::error::$tag is not a release tag (vX.Y.Z or vX.Y.Z-rc.N)"; exit 1
          fi
          {
            echo "mode=$mode"
            echo "final=$final"
            echo "candidate=$candidate"
          } >> "$GITHUB_OUTPUT"
      # The second check of a promote's bytes (verify already checked the
      # signature): what goes out is exactly what the candidate Release has.
      - name: "Promote: the bytes are the candidate's"
        if: steps.plan.outputs.mode == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.plan.outputs.candidate }}
        run: |
          set -euo pipefail
          gh release download "$CANDIDATE" --repo "$GITHUB_REPOSITORY" -p 'homefleet-*' -D "$RUNNER_TEMP/candidate"
          for f in release/homefleet-*.tgz release/homefleet-*.manifest.json
          do
            cmp "$f" "$RUNNER_TEMP/candidate/${f#release/}" \
              || { echo "::error::$f differs from the one in $CANDIDATE"; exit 1; }
          done
      # Build provenance (SLSA Build L2): which commit and workflow run built
      # these bytes. Check with `gh attestation verify <file> -R <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/homefleet-*.tgz
            release/homefleet-*.manifest.json
      # Draft first, assets attached, then publish: an immutable Release
      # can't gain assets once published. A re-run after a failed publish
      # replaces the leftover draft; a PUBLISHED Release is never touched.
      # Title = the notes file's first line without "# "; body = the rest.
      # A candidate: its final's notes under the candidate's tag, a notice
      # line first, a prerelease that never becomes "latest".
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.plan.outputs.mode }}
          FINAL: ${{ steps.plan.outputs.final }}
        run: |
          tag="$GITHUB_REF_NAME"
          mode="$MODE"
          final="$FINAL"
          # Only gh's "release not found" means there is no Release yet; any
          # other failure (network, auth, rate limit) stops the run.
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/view.err")"; then
            if [ "$draft" != "true" ]; then
              echo "::error::release $tag is already published"; exit 1
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          elif ! grep -q "release not found" "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            echo "::error::could not check for an existing release $tag"; exit 1
          fi
          notes="docs/releases/$final.md"
          title="$(head -n 1 "$notes" | sed 's/^# //')"
          tail -n +2 "$notes" | sed '/./,$!d' > "$RUNNER_TEMP/body.md"
          prerelease=()
          if [ "$mode" = candidate ]; then
            title="${title/"$final"/"$tag"}"
            {
              echo "> **Release candidate for testing on Hugo's rig — not for general use.** Promoted to $final once it passes."
              echo
              cat "$RUNNER_TEMP/body.md"
            } > "$RUNNER_TEMP/notes.md"
            prerelease=(--prerelease --latest=false)
          else
            cp "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/notes.md"
          fi
          # The three signed-release files only, by name pattern: anything
          # else pack slipped into its artifact stays out of the Release.
          gh release create "$tag" release/homefleet-*.tgz \
            release/homefleet-*.manifest.json release/homefleet-*.manifest.sig \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
