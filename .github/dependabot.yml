# Weekly, one grouped PR per ecosystem. A 7-day cooldown (zizmor's floor;
# Dependabot's default is 3) keeps brand-new, possibly malicious versions out
# while the ecosystem catches them. Security updates are exempt.
# Actions stay SHA-pinned; Dependabot updates the SHA and its version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
